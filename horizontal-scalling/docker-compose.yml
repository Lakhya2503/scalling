services:
  server1:
    build: ./app
    environment:
      SERVER_NAME: SERVER-1
  
  server2:
    build: ./app
    environment:
      SERVER_NAME: SERVER-2
  
  server3:
    build: ./app
    environment:
      SERVER_NAME : SERVER-3

  nginx:
    image: nginx:latest
    ports: 
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3